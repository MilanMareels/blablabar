services:
  react-website:
    build:
      context: .
      args:
        - VITE_COMPANY_NAME=${VITE_COMPANY_NAME}
        - VITE_CONTACT_FORM_KEY=${VITE_CONTACT_FORM_KEY}
    container_name: website-blablabar
    restart: unless-stopped
    ports:
      - "3007:80"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
